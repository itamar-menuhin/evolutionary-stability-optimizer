[tool.poetry]
# The PyPI distribution name (what `pip install ...` uses) is
# "evolutionary-stability-optimizer" - plain "eso" was already taken on PyPI
# by an unrelated package. This does NOT change the importable package name:
# `packages = [{ include = "eso" }]` below still installs a module you
# `import eso` exactly as before - only the install command changes.
name = "evolutionary-stability-optimizer"
version = "0.1.2"
description = "Evolutionary Stability Optimizer (ESO) - detects and removes hypermutable sites (recombination, slippage, methylation hotspots) from engineered DNA sequences while preserving translation and codon usage."
authors = ["Itamar Menuhin"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/itamar-menuhin/evolutionary-stability-optimizer"
repository = "https://github.com/itamar-menuhin/evolutionary-stability-optimizer"
documentation = "https://github.com/itamar-menuhin/evolutionary-stability-optimizer#readme"
keywords = ["synthetic-biology", "dna", "codon-optimization", "genetic-stability", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
packages = [{ include = "eso" }]
include = ["eso/data/*.csv"]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/itamar-menuhin/evolutionary-stability-optimizer/issues"

[tool.poetry.dependencies]
python = "^3.11"
biopython = "^1.87"
numpy = ">=1.26,<3.0"
pandas = "^3.0.3"
scikit-learn = "^1.9.0.0"
dnachisel = "^3.2.16"
rapidfuzz = ">=3.0,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
python-docx = "^1.1.0"
hypothesis = "^6.100"

[tool.poetry.extras]
docx-report = ["python-docx"]

[tool.poetry.dependencies.python-docx]
version = "^1.1.0"
optional = true

[tool.poetry.scripts]
eso-optimize = "eso.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
